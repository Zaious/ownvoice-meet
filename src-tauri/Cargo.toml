[package]
name = "ownvoice-meet"
version = "0.1.0"
description = "Understand the meeting. Answer in your own voice."
license = "Apache-2.0"
repository = "https://github.com/Zaious/ownvoice-meet"
edition = "2021"
rust-version = "1.80"

[lib]
name = "ownvoice_meet_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cpal = "0.17.3"
base64 = "0.23.1"
futures-util = "0.3.34"
tokio = { version = "1.53.3", features = ["sync", "time", "macros", "rt"] }
tokio-tungstenite = { version = "0.29.0", features = ["rustls-tls-native-roots"] }
keyring = { version = "3.6.3", features = ["windows-native"] }
reqwest = { version = "0.13.3", default-features = false, features = ["json", "stream", "http2", "rustls-no-provider", "multipart"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std"] }
dotenvy = "0.15.7"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
tauri-plugin-opener = "2"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-global-shortcut = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
