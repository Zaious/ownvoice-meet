[package]
name = "eztrans"
version = "0.1.0"
description = "Live meeting interpreter: captions with translation, a reply teleprompter, and a bilingual script panel."
license = "Apache-2.0"
repository = "https://github.com/Zaious/eztrans"
edition = "2021"
rust-version = "1.80"

[lib]
name = "eztrans_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-global-shortcut = "2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
