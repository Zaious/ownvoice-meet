<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OwnVoice Meet · Settings</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <form id="form" class="scroll settings">
      <h2>聽：語音辨識</h2>
      <p class="hint">每小時費用以連續一小時的音訊計。</p>
      <div id="stt-list" class="choices"></div>
      <div id="stt-local" class="local" hidden>
        <label>伺服器網址（OpenAI 相容，到 /v1 為止）<input name="local_stt_url" /></label>
        <label>模型名稱 <input name="local_stt_model" /></label>
      </div>
      <label>語言（BCP-47，例如 en-US；留空＝自動偵測）
        <input name="stt_language" list="langs" />
        <datalist id="langs"><option value="en-US"></option><option value="en-GB"></option><option value="ja-JP"></option></datalist>
      </label>

      <h2>翻：翻譯與回覆</h2>
      <p class="hint">每小時費用為估算：600 句，每句約 300 個輸入 token、50 個輸出 token。</p>
      <div id="llm-list" class="choices"></div>
      <div id="llm-local" class="local" hidden>
        <label>伺服器網址（OpenAI 相容，到 /v1 為止；Ollama 預設 http://localhost:11434/v1）<input name="local_llm_url" /></label>
        <label>模型名稱 <input name="local_llm_model" placeholder="例如 qwen3:8b" /></label>
      </div>
      <label>思考深度
        <select name="llm_effort">
          <option value="auto">自動（該模型最快的設定）</option>
          <option value="low">low</option><option value="medium">medium</option><option value="high">high</option>
        </select>
      </label>
      <label>上下文行數 <input name="context_lines" type="number" min="0" max="50" /></label>

      <h2>API key</h2>
      <p class="hint">存在 Windows 認證管理員（macOS 鑰匙圈），不會寫進檔案，也不會傳回這個視窗。留空＝不變更。</p>
      <label>Anthropic <span class="keystate" data-provider="anthropic"></span> <a class="getkey" href="https://platform.claude.com/settings/keys">取得 key ↗</a><input name="key_anthropic" type="password" autocomplete="off" /></label>
      <label>OpenAI <span class="keystate" data-provider="openai"></span> <a class="getkey" href="https://platform.openai.com/settings/organization/api-keys">取得 key ↗</a><input name="key_openai" type="password" autocomplete="off" /></label>
      <label>Gemini（請用付費層）<span class="keystate" data-provider="gemini"></span> <a class="getkey" href="https://aistudio.google.com/api-keys">取得 key ↗</a><input name="key_gemini" type="password" autocomplete="off" /></label>
      <label>本機伺服器（選填）<span class="keystate" data-provider="local"></span><input name="key_local" type="password" autocomplete="off" /></label>

      <h2>術語表</h2>
      <label>每行「中文 = English」，兩個方向都會套用
        <textarea name="glossary" rows="6" placeholder="季度營收 = quarterly revenue"></textarea>
      </label>

      <div class="actions">
        <button type="submit">儲存</button>
        <button type="button" id="clear-keys">清除所有 key</button>
        <span id="saved" class="status"></span>
      </div>

      <h2>用量（估算）</h2>
      <div class="tabs" id="usage-tabs">
        <button type="button" data-range="session" aria-pressed="true">這次開啟</button>
        <button type="button" data-range="today" aria-pressed="false">今天</button>
        <button type="button" data-range="month" aria-pressed="false">本月</button>
        <button type="button" id="usage-refresh">重新整理</button>
      </div>
      <table id="usage" class="usage"></table>
      <p class="hint">依官方牌價估算；實際費用以各家帳單為準。本機與裝置上的選項不計費。</p>

      <h2>版本</h2>
      <div class="actions">
        <span id="version"></span>
        <button type="button" id="check-update">檢查更新</button>
        <button type="button" id="install-update" hidden>更新並重新啟動</button>
        <a id="release-link" class="outlink" href="https://github.com/Zaious/ownvoice-meet/releases" hidden>下載頁 ↗</a>
      </div>
      <p id="update-note" class="hint">只有按「檢查更新」時才會連到 GitHub。</p>
    </form>
    <script type="module" src="/src/settings/main.ts"></script>
  </body>
</html>
