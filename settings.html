<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>eztrans · Settings</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <form id="form" class="scroll settings">
      <h2>語音辨識（Gemini Live）</h2>
      <label>Gemini API key <span class="keystate" data-provider="gemini"></span>
        <input name="key_gemini" type="password" autocomplete="off" placeholder="留空＝不變更" />
      </label>
      <p class="hint">用付費層的 key：免費層的資料會被 Google 用來改進產品。</p>
      <label>模型 <input name="stt_model" required /></label>
      <label>語言（BCP-47，例如 en-US；留空＝自動偵測）
        <input name="stt_language" list="langs" />
        <datalist id="langs"><option value="en-US"></option><option value="en-GB"></option><option value="ja-JP"></option><option value="cmn-Hans-CN"></option></datalist>
      </label>

      <h2>翻譯與回覆（Anthropic Claude）</h2>
      <label>Anthropic API key <span class="keystate" data-provider="anthropic"></span>
        <input name="key_anthropic" type="password" autocomplete="off" placeholder="留空＝不變更" />
      </label>
      <label>模型 <input name="llm_model" required /></label>
      <label>Effort
        <select name="llm_effort"><option>low</option><option>medium</option><option>high</option></select>
      </label>
      <label>上下文行數 <input name="context_lines" type="number" min="0" max="50" /></label>

      <h2>術語表</h2>
      <label>每行「中文 = English」，兩個方向都會套用
        <textarea name="glossary" rows="8" placeholder="季度營收 = quarterly revenue"></textarea>
      </label>

      <div class="actions">
        <button type="submit">儲存</button>
        <button type="button" id="clear-keys">清除兩把 key</button>
        <span id="saved" class="status"></span>
      </div>
      <p class="hint">key 存在 Windows 認證管理員（macOS 鑰匙圈），不會寫進檔案，也不會傳回這個視窗。</p>
    </form>
    <script type="module" src="/src/settings/main.ts"></script>
  </body>
</html>
