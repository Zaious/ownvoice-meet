<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OwnVoice Meet</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div class="bar">
      <button id="listen" class="live" aria-pressed="false">▶ 聆聽</button>
      <button id="demo" title="播放一段示範字幕：不收音、不連網、不花錢">Demo</button>
      <button id="clear" title="清除字幕（也會停止播放中的 Demo）">清除</button>
      <span id="level" class="level" aria-hidden="true"></span>
      <span id="status" class="status grow"></span>
      <button id="reply" aria-pressed="false" title="Ctrl+Shift+Space">回覆 <kbd>Ctrl+Shift+Space</kbd></button>
      <button id="script" aria-pressed="false">講稿</button>
      <button id="settings" aria-pressed="false" title="設定">⚙</button>
      <span id="view"></span>
      <button id="zh-only" aria-pressed="false" title="只顯示中文翻譯；還沒翻好的那句先顯示英文">只看中文</button>
      <button id="through" title="滑鼠點擊會穿過字幕視窗。用系統匣圖示或 Ctrl+Shift+F8 恢復">穿透</button>
    </div>
    <div id="through-note" class="through">滑鼠穿透中：點擊會落到下面的視窗。按 Ctrl+Shift+F8 或系統匣圖示恢復。</div>
    <div id="captions" class="scroll" role="region" aria-label="字幕">
      <div class="empty">按「聆聽」開始擷取系統音訊，或按 Demo 看示範。</div>
    </div>
    <script type="module" src="/src/captions/main.ts"></script>
  </body>
</html>
